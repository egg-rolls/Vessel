<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plugins</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="tabs" id="tabs" role="tablist" aria-label="Plugins">
        <button
          type="button"
          role="tab"
          data-tab="browse"
          aria-selected="true"
          data-i18n="tab.marketplace"
        >
          Marketplace
        </button>
        <button
          type="button"
          role="tab"
          data-tab="installed"
          aria-selected="false"
          data-i18n="tab.installed"
        >
          My plugins
        </button>
        <button
          type="button"
          role="tab"
          data-tab="updates"
          aria-selected="false"
          data-i18n="tab.updates"
        >
          Updates
        </button>
      </div>
      <div id="status" aria-live="polite"></div>
      <main>
        <section role="tabpanel" id="panel-browse" data-panel="browse"></section>
        <section role="tabpanel" id="panel-installed" data-panel="installed" hidden></section>
        <section role="tabpanel" id="panel-updates" data-panel="updates" hidden></section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
