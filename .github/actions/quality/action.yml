name: Quality Checks
description: Install dependencies and run lint, typecheck, and build.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Cache Bun install
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # apps/web 不在根 workspaces 里，web build 需要它自己的 Node 依赖（react 等），
    # 所以这里单独 setup Node 并 npm ci。
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/web/package-lock.json

    - name: Install web dependencies
      shell: bash
      working-directory: apps/web
      run: npm ci

    - name: Lint
      shell: bash
      run: bun run lint

    - name: Typecheck
      shell: bash
      run: bun run typecheck

    - name: Build
      shell: bash
      run: bun run build
