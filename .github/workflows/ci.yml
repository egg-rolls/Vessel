name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 质量门禁（PR + main/release push）─────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run quality checks
        uses: ./.github/actions/quality

  # ── 架构依赖方向（R8b；subpath 冒烟就绪前不设 required）──
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency direction
        run: bun run scripts/check-deps.ts

      - name: Smoke subpath exports
        run: bun run scripts/smoke-subpaths.ts

      - name: Check docs consistency
        run: bun run scripts/check-docs.ts

      - name: Check web style contract
        run: bun run scripts/check-web-styles.ts

      - name: Check RPC method table
        run: bun run scripts/check-rpc-methods.ts

      - name: Check version consistency
        run: bun run scripts/version.ts --check

  # ── 离线集成：config sources matrix / trace smoke ──
  # 原 MCP / gateway / evals / feishu / core 的离线测试已随测试移除；
  # 这里只保留不依赖外网的脚本检查。
  offline-integration:
    name: Offline Integration
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Config sources matrix
        run: bun run scripts/check-config-sources.ts

      - name: Trace smoke
        run: bun run scripts/check-trace.ts

  # ── 0.6 TLS / CA 专项（ubuntu；非 required）────────
  # 测试已移除：本 job 现在只做依赖安装，保留结构以免改动 branch protection 语义。
  tls-ca:
    name: TLS CA
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  # ── 0.6 独立前端 / CORS 专项（ubuntu；非 required）──
  # 测试已移除：本 job 现在只做依赖安装，保留结构以免改动 branch protection 语义。
  frontend-cors:
    name: Frontend CORS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  # ── 发布干跑：PR + release/**（0.4，不发布、不上传）──
  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Packs each public package to an OS temp dir and validates it.
      # Never publishes, uploads, tags, or touches main.
      - name: Release dry run
        run: bun run scripts/release-dry-run.ts

  # ── 安装解析 smoke：18 个子包 + 根 tarball（ubuntu；不发布）──
  install-smoke:
    name: Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # 根 tarball 的 files 包含 apps/web/dist（被 .gitignore 忽略），
      # 必须先构建，smoke 才能断言根包内含 Web 控制台。
      - name: Build web console
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      # npm pack 全部 18 个可发布包 + 根 tarball，临时工程用 overrides 指向
      # 本地 tarball 安装，然后运行 `vessel --version` / `vessel --tools`。
      - name: Install resolution smoke
        run: bun run scripts/smoke-install.ts

  # ── 跨平台（PR 只跑 ubuntu，main/release 跑全矩阵）──
  cross-platform:
    name: Cross Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PR 只跑 ubuntu；main / release/** 跑全矩阵
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web 不在根 workspaces 里，web build 需要它自己的 Node 依赖（react 等），
      # 所以这里单独 setup Node 并 npm ci。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run type checking
        run: bun run typecheck

  # ── Web 控制台构建 ───────────────────────────────
  web:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web console
        working-directory: apps/web
        run: npm run build

  # ── examples（上轮盲区：不在 typecheck 覆盖内）────
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck examples
        run: bunx tsc -p examples/tsconfig.json --noEmit

      - name: Run examples
        run: bun run demo

  # ── 冒烟测试（仅 main/release push 后跑）──────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CLI --version
        run: bun run src/cli.ts --version

      - name: CLI --tools
        run: VESSEL_MOCK=1 bun run src/cli.ts --tools

      - name: headless mock 模式
        run: VESSEL_MOCK=1 bun run src/cli.ts --run "hello"

      - name: headless 管道模式
        run: echo "hello" | VESSEL_MOCK=1 bun run src/cli.ts --run

      - name: headless @file 模式
        run: VESSEL_MOCK=1 bun run src/cli.ts --run @examples/demo.ts

      - name: 交互模式 /exit
        run: echo "/exit" | VESSEL_MOCK=1 bun run src/cli.ts

      - name: /help 命令
        run: echo "/help" | VESSEL_MOCK=1 bun run src/cli.ts
