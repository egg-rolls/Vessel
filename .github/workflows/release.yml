name: Release

# 只在推送 tag 时触发（v*），不自动发布每次 commit
# 发布由人决定时机：git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 质量检查（发布前最后一道防线）─────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run typecheck

      - name: Run tests
        run: bun test

  # ── 构建二进制 ───────────────────────────────
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun run build:binary

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vessel-${{ github.ref_name }}
          path: dist/vessel

  # ── 创建 GitHub Release ──────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: vessel-${{ github.ref_name }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: dist/vessel
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

